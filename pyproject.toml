[project]
name = "news-aggregator"
version = "0.1.0"
description = "Search and crawl engine for news aggregation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "crawl4ai>=0.8.0,<0.9",
    "fastapi>=0.115,<1",
    "feedparser>=6.0.12,<7",
    "fastembed>=0.4,<1",
    "googlenewsdecoder>=0.1.7,<0.2",
    "httpx>=0.28.1,<1",
    "pgvector>=0.3,<1",
    "prometheus-client>=0.21,<1",
    "python-dotenv>=1.1.1,<2",
    "pyyaml>=6,<7",
    "sqlalchemy[asyncio]>=2.0,<3",
    "tavily-python>=0.7.12,<1",
    "tldextract>=5.3,<6",
    "uvicorn[standard]>=0.34,<1",
    "html2text>=2024.2,<2026",
    "langchain>=1.4,<2",
    "langchain-openai>=1.6,<2",
    "langgraph>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1,<9",
]

[project.scripts]
news-pipeline = "pipelines.news:main"
news-worker = "workers.cli:main"
news-service = "services.news:main"
news-api = "api.main:run"
news-admin-api = "admin_api.main:run"


[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
addopts = "-m 'not semantic'"
markers = [
    "integration: requires a migrated PostgreSQL database",
    "semantic: loads the production embedding model for golden semantic cases",
]
testpaths = ["backend/tests"]
