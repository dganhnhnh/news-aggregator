[project]
name = "news-aggregator"
version = "0.1.0"
description = "Search and crawl engine for news aggregation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "crawl4ai>=0.8.0,<0.9",
    "feedparser>=6.0.12,<7",
    "googlenewsdecoder>=0.1.7,<0.2",
    "httpx>=0.28.1,<1",
    "python-dotenv>=1.1.1,<2",
    "sqlalchemy[asyncio]>=2.0,<3",
    "tavily-python>=0.7.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1,<9",
]

[project.scripts]
news-pipeline = "pipelines.news:main"
news-service = "services.news:main"


[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: requires a migrated PostgreSQL database",
]
