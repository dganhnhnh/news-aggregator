name: news-radar

services:
  db:
    image: pgvector/pgvector:pg16
    labels:
      news-radar.project: news-radar
      news-radar.group: app
      news-radar.service: db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-news_radar}
      POSTGRES_USER: ${POSTGRES_USER:-news_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-news_radar}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - news_radar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.api
    labels:
      news-radar.project: news-radar
      news-radar.group: app
      news-radar.service: api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-news_radar}:${POSTGRES_PASSWORD:-news_radar}@db:5432/${POSTGRES_DB:-news_radar}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_METRICS_HOST: 0.0.0.0
      API_METRICS_PORT: 8002
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_EXTRA_BODY: ${OPENROUTER_EXTRA_BODY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nvidia/nemotron-3.5-lightning:free}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-60}
      NEWS_AGENT_RUN_TIMEOUT_SECONDS: ${NEWS_AGENT_RUN_TIMEOUT_SECONDS:-90}
      FASTEMBED_CACHE_PATH: /models
    ports:
      - "${API_PORT:-8000}:8000"
      # The exporter, on loopback only. The API itself is public; its request
      # rates, model spend and search latency are not.
      - "127.0.0.1:${API_METRICS_PORT:-8002}:8002"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ../backend
        target: /app/backend
      - model_cache:/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/db', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  admin-api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.api
    labels:
      news-radar.project: news-radar
      news-radar.group: app
      news-radar.service: admin-api
    command:
      - uv
      - run
      - news-admin-api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-news_radar}:${POSTGRES_PASSWORD:-news_radar}@db:5432/${POSTGRES_DB:-news_radar}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ADMIN_API_HOST: 0.0.0.0
      ADMIN_API_PORT: 8001
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    ports:
      - "127.0.0.1:${ADMIN_API_PORT:-8001}:8001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ../backend
        target: /app/backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  instant-crawl:
    image: ${NEWS_RADAR_WORKER_IMAGE:-news-radar-worker:dev}
    labels:
      news-radar.project: news-radar
      news-radar.group: app
      news-radar.service: instant-crawl
    build:
      context: ..
      dockerfile: deployments/Dockerfile.worker
    command:
      - instant-crawl
      - --last
      - 12h
      - --interval
      - ${INSTANT_FEED_POLL_INTERVAL_SECONDS:-30}
      - --poll-interval
      - ${INSTANT_FEED_POLL_INTERVAL_SECONDS:-30}
      - --max-concurrent-crawls
      - ${INSTANT_MAX_CONCURRENT_CRAWLS:-3}
      - --crawl-batch-size
      - ${INSTANT_CRAWL_BATCH_SIZE:-5}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-news_radar}:${POSTGRES_PASSWORD:-news_radar}@db:5432/${POSTGRES_DB:-news_radar}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INSTANT_FEED_POLL_INTERVAL_SECONDS: ${INSTANT_FEED_POLL_INTERVAL_SECONDS:-30}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ../backend
        target: /app/backend
    shm_size: 1gb
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # The three services below replace the Airflow DAGs `news_ingest`,
  # `news_semantic` and `news_maintenance`; see docs/orchestration-workers.md.
  # Airflow is suspended, not deleted: deployments/docker-compose.airflow.yml.
  ingest:
    image: ${NEWS_RADAR_WORKER_IMAGE:-news-radar-worker:dev}
    labels:
      news-radar.project: news-radar
      news-radar.group: app
      news-radar.service: ingest
    build:
      context: ..
      dockerfile: deployments/Dockerfile.worker
    # One crawl run at a time across every machine (the advisory lock makes
    # extra replicas exit as "busy"), so this service is not scaled. The
    # runtime budget ends a slow run, not the process.
    command:
      - crawl
      - --last
      - 12h
      - --interval
      - ${INGEST_INTERVAL_SECONDS:-300}
      - --max-runtime
      - ${INGEST_MAX_RUNTIME:-8m}
    environment: &worker-environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-news_radar}:${POSTGRES_PASSWORD:-news_radar}@db:5432/${POSTGRES_DB:-news_radar}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FASTEMBED_CACHE_PATH: /models
      MAX_CONCURRENT_FEEDS: ${MAX_CONCURRENT_FEEDS:-8}
      MAX_CONCURRENT_CRAWLS: ${MAX_CONCURRENT_CRAWLS:-6}
      FEED_FETCH_TIMEOUT_SECONDS: ${FEED_FETCH_TIMEOUT_SECONDS:-8}
      FEED_POLL_FAST_INTERVAL_SECONDS: ${FEED_POLL_FAST_INTERVAL_SECONDS:-300}
      FEED_POLL_INTERVAL_SECONDS: ${FEED_POLL_INTERVAL_SECONDS:-1800}
      FEED_POLL_SLOW_INTERVAL_SECONDS: ${FEED_POLL_SLOW_INTERVAL_SECONDS:-21600}
      FEED_POLL_MIN_GAPS: ${FEED_POLL_MIN_GAPS:-3}
      FEED_POLL_TRIM_FRACTION: ${FEED_POLL_TRIM_FRACTION:-0.1}
      FEED_POLL_FUTURE_TOLERANCE_SECONDS: ${FEED_POLL_FUTURE_TOLERANCE_SECONDS:-300}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ../backend
        target: /app/backend
      - type: bind
        source: ../data
        target: /data
        read_only: true
    shm_size: 1gb
    # Long enough for the active chunk to commit and close its worker_runs
    # row as `partial` after SIGTERM.
    stop_grace_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g

  semantic:
    image: ${NEWS_RADAR_WORKER_IMAGE:-news-radar-worker:dev}
    labels:
      news-radar.project: news-radar
      news-radar.group: app
      news-radar.service: semantic
    build:
      context: ..
      dockerfile: deployments/Dockerfile.worker
    # Woken by NOTIFY on every processing_jobs enqueue. Safe to scale with
    # `--scale semantic=N`, or to run on another machine against the same
    # DATABASE_URL: embed and classify split the queue, cluster/merge/refresh
    # run on whichever replica holds the lock.
    command:
      - semantic
      - --last
      - ${SEMANTIC_WINDOW:-24h}
    environment: *worker-environment
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ../backend
        target: /app/backend
      - model_cache:/models
    stop_grace_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M

  maintenance:
    image: ${NEWS_RADAR_WORKER_IMAGE:-news-radar-worker:dev}
    labels:
      news-radar.project: news-radar
      news-radar.group: app
      news-radar.service: maintenance
    build:
      context: ..
      dockerfile: deployments/Dockerfile.worker
    # supercronic runs `news-worker maintenance` at 03:00 UTC. Run it now
    # with `docker compose exec maintenance news-worker maintenance`.
    entrypoint: ["/usr/bin/tini", "--", "supercronic", "/etc/news-radar/crontab"]
    command: []
    environment:
      <<: *worker-environment
      TZ: UTC
      TAXONOMY_DISCOVERY_ENABLED: ${TAXONOMY_DISCOVERY_ENABLED:-false}
      TAXONOMY_LLM_EXTRA_BODY: ${TAXONOMY_LLM_EXTRA_BODY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_EXTRA_BODY: ${OPENROUTER_EXTRA_BODY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nvidia/nemotron-3.5-lightning:free}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ../backend
        target: /app/backend
      - type: bind
        source: ./crontab
        target: /etc/news-radar/crontab
        read_only: true
      - model_cache:/models
    stop_grace_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

volumes:
  news_radar_postgres_data:
    name: news_radar_postgres_data
  model_cache:
    name: news_radar_model_cache
