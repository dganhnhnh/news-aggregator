name: news-radar

services:
  db:
    image: pgvector/pgvector:pg16
    labels:
      news-radar.project: news-radar
      news-radar.group: app
      news-radar.service: db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-news_radar}
      POSTGRES_USER: ${POSTGRES_USER:-news_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-news_radar}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - news_radar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.api
    labels:
      news-radar.project: news-radar
      news-radar.group: app
      news-radar.service: api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-news_radar}:${POSTGRES_PASSWORD:-news_radar}@db:5432/${POSTGRES_DB:-news_radar}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nvidia/nemotron-3.5-lightning:free}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-60}
      NEWS_AGENT_RUN_TIMEOUT_SECONDS: ${NEWS_AGENT_RUN_TIMEOUT_SECONDS:-90}
      FASTEMBED_CACHE_PATH: /models
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ../backend
        target: /app/backend
      - model_cache:/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/db', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  admin-api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.api
    labels:
      news-radar.project: news-radar
      news-radar.group: app
      news-radar.service: admin-api
    command:
      - uv
      - run
      - news-admin-api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-news_radar}:${POSTGRES_PASSWORD:-news_radar}@db:5432/${POSTGRES_DB:-news_radar}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ADMIN_API_HOST: 0.0.0.0
      ADMIN_API_PORT: 8001
    ports:
      - "127.0.0.1:${ADMIN_API_PORT:-8001}:8001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ../backend
        target: /app/backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  instant-crawl:
    image: ${NEWS_RADAR_WORKER_IMAGE:-news-radar-worker:dev}
    labels:
      news-radar.project: news-radar
      news-radar.group: app
      news-radar.service: instant-crawl
    build:
      context: ..
      dockerfile: deployments/Dockerfile.worker
    command:
      - instant-crawl
      - --last
      - 12h
      - --interval
      - ${INSTANT_FEED_POLL_INTERVAL_SECONDS:-30}
      - --poll-interval
      - ${INSTANT_FEED_POLL_INTERVAL_SECONDS:-30}
      - --max-concurrent-crawls
      - ${INSTANT_MAX_CONCURRENT_CRAWLS:-3}
      - --crawl-batch-size
      - ${INSTANT_CRAWL_BATCH_SIZE:-5}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-news_radar}:${POSTGRES_PASSWORD:-news_radar}@db:5432/${POSTGRES_DB:-news_radar}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INSTANT_FEED_POLL_INTERVAL_SECONDS: ${INSTANT_FEED_POLL_INTERVAL_SECONDS:-30}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ../backend
        target: /app/backend
    shm_size: 1gb
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  news_radar_postgres_data:
    name: news_radar_postgres_data
  model_cache:
    name: news_radar_model_cache
