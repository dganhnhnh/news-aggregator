global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    stack: news-radar

storage:
  tsdb:
    retention:
      time: 15d
      size: 5GB

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  # Application metrics, derived from PostgreSQL by the admin API. Scraped
  # half as often as the host jobs because every collection reads the
  # operational tables, and because queue depth does not move in 15s.
  - job_name: news-radar
    scrape_interval: 30s
    static_configs:
      - targets:
          - admin-api:8001

  # In-process metrics of the public API: request latency, search, the
  # research agent. Served on a second listener that is published on
  # loopback, so this never rides on 0.0.0.0:8000.
  - job_name: news-radar-api
    static_configs:
      - targets:
          - api:8002

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:18080
    metric_relabel_configs:
      - source_labels:
          - container_label_news_radar_project
        regex: news-radar
        action: keep
